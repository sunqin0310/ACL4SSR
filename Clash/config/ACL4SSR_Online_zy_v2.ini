[custom]
; MiSub 内置转换 -> Clash/Mihomo（需要支持 MRS 的内核）
; 不适用于原版 subconverter / Surge / sing-box 输出
; 域名采用 DustinWin 动态 MRS；Google、Telegram、国内 IP 使用 classical 补充源
; Emby 原始源：https://raw.githubusercontent.com/sunqin0310/ACL4SSR/refs/heads/main/Clash/embyzy.list
; 下方使用同仓库同分支 main 的等价 URL，避免 MiSub 将 refs/heads/main 错误改写为 CDN ref


; 局域网与保留地址使用 ACL4SSR 动态 classical 规则集
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ads.mrs
ruleset=🤖 Ai平台,https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ai.mrs
ruleset=📹 油管视频,https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/youtube.mrs
ruleset=🎵 TikTok,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/TikTok/TikTok.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/games-cn.mrs
ruleset=📢 谷歌服务,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Google/Google.list
ruleset=📲 电报信息,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Telegram/Telegram.list
ruleset=📹 Emby自定义,https://raw.githubusercontent.com/sunqin0310/ACL4SSR/main/Clash/embyzy.list
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/media.mrs
ruleset=🚀 节点选择,https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/proxy.mrs
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn.mrs
ruleset=🎯 全球直连,https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/ChinaIPs/ChinaIPs.list
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; 保留原有全部策略组与默认选择
custom_proxy_group=🚀 节点选择`select`[]🔯 故障转移`[]DIRECT`.*
custom_proxy_group=🔯 故障转移`fallback`.*`http://www.gstatic.com/generate_204`180
custom_proxy_group=📢 谷歌服务`select`[]🚀 节点选择`[]🔯 故障转移`.*
custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]🔯 故障转移`.*
custom_proxy_group=🎵 TikTok`select`[]🚀 节点选择`[]🔯 故障转移`.*
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]🔯 故障转移`.*
custom_proxy_group=🤖 Ai平台`select`[]🚀 节点选择`[]🔯 故障转移`.*
custom_proxy_group=📹 Emby自定义`select`[]🚀 节点选择`[]🔯 故障转移`.*
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]🔯 故障转移`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
